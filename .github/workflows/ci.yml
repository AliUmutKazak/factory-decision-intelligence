name: Industrial Quality Gate & Verification Matrix

# Release-closure verification run: validate the current main branch end to end.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Industrial Quality Gate & Verification Matrix
    runs-on: ubuntu-24.04
    env:
      FACTORY_BUILD_GIT_SHA: ${{ github.sha }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Core & Quality Tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-linux.lock
        pip install ruff pytest

    - name: Ensure Directory Structure
      run: |
        mkdir -p data/processed reports artifacts/reference

    - name: Audit Python dependency advisories
      run: |
        python -m pip install pip-audit==2.10.1
        python scripts/audit_dependency_advisories.py

    - name: Verify release and gate evidence inventory
      run: python scripts/verify_evidence_register.py

    - name: "Quality Gate 1: Static Code Analysis & Formatting (Ruff)"
      run: |
        ruff check src/ tests/ dashboard/ scripts/ main.py
        ruff format --check src/ tests/ dashboard/ scripts/ main.py

    - name: "Quality Gate 2: Full Pipeline Execution (Integration Run)"
      run: |
        python main.py

    - name: "Quality Gate 3: Database Schema & Master Data Validation"
      run: |
        python -c "
        import sqlite3
        from pathlib import Path
        db_path = Path('data/factory.db')
        assert db_path.exists(), f'{db_path} does not exist!'
        conn = sqlite3.connect(db_path)
        cur = conn.cursor()
        required_tables = ['machines', 'products', 'materials', 'bom', 'routing', 'machine_state', 'machine_state_snapshot', 'machine_calendar', 'pipeline_runs']
        cur.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")
        existing = {row[0] for row in cur.fetchall()}
        missing = set(required_tables) - existing
        if missing:
            raise AssertionError(f'Missing required tables in schema: {missing}')
        print(f'Schema validation PASSED. Verified {len(required_tables)} core tables.')
        conn.close()
        "

    - name: "Quality Gate 4: Artifact & Report Manifest Validation"
      run: |
        python scripts/verify_active_run.py

    - name: "Quality Gate 5: Industrial Scenario Matrix & OR Physics Tests"
      run: |
        pytest -v --durations=10

    - name: Upload verified synthetic release candidate
      id: release_artifact
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v6
      with:
        name: fdi-lab-candidate-${{ github.sha }}
        path: |
          artifacts/runs/
          artifacts/reference/manifest.json
        if-no-files-found: error
        retention-days: 30

    - name: Record release candidate identity
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      run: |
        echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Artifact: ${{ steps.release_artifact.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Artifact SHA-256: ${{ steps.release_artifact.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"

  docker-smoke:
    name: Clean Docker startup and persistent ACTIVE run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACTORY_BUILD_GIT_SHA: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
    - name: Generate isolated local access keys
      run: |
        echo "FDI_API_READ_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "FDI_API_SCENARIO_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "FDI_API_RESCHEDULE_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
    - name: Prepare writable single-host bind mounts
      run: mkdir -p data/processed reports artifacts/runs
    - name: Build and prepare a fresh runtime
      run: docker compose up --build -d --wait --wait-timeout 240 api dashboard
    - name: Verify services and ACTIVE lineage
      run: |
        test "$(docker compose exec -T api id -u)" != 0
        test "$(docker compose exec -T dashboard id -u)" != 0
        curl --fail http://localhost:8501/_stcore/health
        curl --fail http://localhost:8000/ready > /tmp/ready-before.json
        docker compose exec -T api python scripts/verify_active_run.py
        python - <<'PY'
        import json, urllib.request
        ready = json.load(open('/tmp/ready-before.json'))
        import os
        import urllib.error
        url = 'http://localhost:8000/api/v1/schedule/current'
        try:
            urllib.request.urlopen(url)
        except urllib.error.HTTPError as exc:
            assert exc.code == 401
        else:
            raise AssertionError('Unauthenticated schedule request was accepted')
        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['FDI_API_READ_TOKEN']})
        tasks = json.load(urllib.request.urlopen(request))
        assert tasks and {task['run_id'] for task in tasks} == {ready['run_id']}
        PY
    - name: Restart and retain the same verified ACTIVE version
      run: |
        docker compose down
        docker compose up -d --wait --wait-timeout 240 api dashboard
        curl --fail http://localhost:8000/ready > /tmp/ready-after.json
        python - <<'PY'
        import json
        assert json.load(open('/tmp/ready-before.json'))['run_id'] == json.load(open('/tmp/ready-after.json'))['run_id']
        PY
        docker compose exec -T api python scripts/verify_active_run.py
    - name: Container logs
      if: always()
      run: |
        docker compose logs --no-color > /tmp/fdi-compose.log
        python - <<'PY'
        import os
        from pathlib import Path

        logs = Path('/tmp/fdi-compose.log').read_text(errors='replace')
        secrets = {
            name: os.environ.get(name, '')
            for name in ('FDI_API_READ_TOKEN', 'FDI_API_SCENARIO_TOKEN', 'FDI_API_RESCHEDULE_TOKEN')
        }
        leaked = [name for name, value in secrets.items() if value and value in logs]
        for value in secrets.values():
            if value:
                logs = logs.replace(value, '[REDACTED]')
        print(logs)
        if leaked:
            raise SystemExit('Access key appeared in container logs: ' + ', '.join(leaked))
        PY
    - name: Stop containers
      if: always()
      run: docker compose down
