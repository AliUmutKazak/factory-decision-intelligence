name: Industrial Quality Gate & Verification Matrix

# Release-closure verification run: validate the current main branch end to end.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-gate:
    name: Industrial Quality Gate & Verification Matrix
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Core & Quality Tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest

    - name: Ensure Directory Structure
      run: |
        mkdir -p data/processed reports artifacts/reference

    - name: "Quality Gate 1: Static Code Analysis & Formatting (Ruff)"
      run: |
        ruff check src/ tests/ dashboard/ scripts/ main.py
        ruff format --check src/ tests/ dashboard/ scripts/ main.py

    - name: "Quality Gate 2: Full Pipeline Execution (Integration Run)"
      run: |
        python main.py

    - name: "Quality Gate 3: Database Schema & Master Data Validation"
      run: |
        python -c "
        import sqlite3
        from pathlib import Path
        db_path = Path('data/factory.db')
        assert db_path.exists(), f'{db_path} does not exist!'
        conn = sqlite3.connect(db_path)
        cur = conn.cursor()
        required_tables = ['machines', 'products', 'materials', 'bom', 'routing', 'machine_state', 'machine_state_snapshot', 'machine_calendar', 'pipeline_runs']
        cur.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")
        existing = {row[0] for row in cur.fetchall()}
        missing = set(required_tables) - existing
        if missing:
            raise AssertionError(f'Missing required tables in schema: {missing}')
        print(f'Schema validation PASSED. Verified {len(required_tables)} core tables.')
        conn.close()
        "

    - name: "Quality Gate 4: Artifact & Report Manifest Validation"
      run: |
        python scripts/verify_active_run.py

    - name: "Quality Gate 5: Industrial Scenario Matrix & OR Physics Tests"
      run: |
        pytest -v --durations=10

  docker-smoke:
    name: Clean Docker startup and persistent ACTIVE run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACTORY_BUILD_GIT_SHA: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
    - name: Build and prepare a fresh runtime
      run: docker compose up --build -d --wait --wait-timeout 240 api dashboard
    - name: Verify services and ACTIVE lineage
      run: |
        curl --fail http://localhost:8501/_stcore/health
        curl --fail http://localhost:8000/ready > /tmp/ready-before.json
        docker compose exec -T api python scripts/verify_active_run.py
        python - <<'PY'
        import json, urllib.request
        ready = json.load(open('/tmp/ready-before.json'))
        tasks = json.load(urllib.request.urlopen('http://localhost:8000/api/v1/schedule/current'))
        assert tasks and {task['run_id'] for task in tasks} == {ready['run_id']}
        PY
    - name: Restart and retain the same verified ACTIVE version
      run: |
        docker compose down
        docker compose up -d --wait --wait-timeout 240 api dashboard
        curl --fail http://localhost:8000/ready > /tmp/ready-after.json
        python - <<'PY'
        import json
        assert json.load(open('/tmp/ready-before.json'))['run_id'] == json.load(open('/tmp/ready-after.json'))['run_id']
        PY
        docker compose exec -T api python scripts/verify_active_run.py
    - name: Container logs
      if: always()
      run: docker compose logs --no-color
    - name: Stop containers
      if: always()
      run: docker compose down
