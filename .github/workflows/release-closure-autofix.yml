name: Release Closure Autofix

on:
  push:
    paths:
      - '.github/workflows/release-closure-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply semantic fixes
        run: python scripts/release_closure_autofix.py

      - name: Ruff autofix and format
        run: |
          ruff check src/ tests/ dashboard/ scripts/ main.py --fix
          ruff format src/ tests/ dashboard/ scripts/ main.py

      - name: Commit fixes
        run: |
          git config user.name 'release-closure-bot'
          git config user.email 'release-closure-bot@users.noreply.github.com'
          git add src tests dashboard scripts main.py
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix(release): apply semantic and Ruff closure fixes'
            git push origin HEAD:main
          fi
